<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Feedback | Feedback Portal</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --star-color: #cbd5e1;
            --star-active: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .feedback-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 32px;
            max-width: 500px;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        .feedback-header {
            margin-bottom: 24px;
        }

        .feedback-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .feedback-header p {
            color: var(--text-muted);
            font-size: 0.925rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 110px;
        }

        /* Star Rating Controls */
        .rating-wrapper {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 6px;
        }

        .rating-wrapper input {
            display: none;
        }

        .rating-wrapper label {
            font-size: 1.75rem;
            color: var(--star-color);
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .rating-wrapper input:checked ~ label,
        .rating-wrapper label:hover,
        .rating-wrapper label:hover ~ label {
            color: var(--star-active);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="feedback-card">
    <div class="feedback-header">
        <h2>We Value Your Feedback</h2>
        <p>Let us know about your experience or how we can improve.</p>
    </div>

    <div id="alert-box" class="alert"></div>

    <form id="feedbackForm" action="https://formsubmit.co/adamrayliffe@gmail.com" method="POST">
        
        <!-- FormSubmit Configurations -->
        <input type="hidden" name="_subject" value="New Feedback Received!">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">

        <!-- Honeypot field to prevent spam bots -->
        <input type="text" name="_honey" style="display:none">

        <div class="form-group">
            <label>Overall Experience</label>
            <div class="rating-wrapper">
                <input type="radio" id="star5" name="Rating" value="5 Stars" required />
                <label for="star5" title="5 stars">&#9733;</label>

                <input type="radio" id="star4" name="Rating" value="4 Stars" />
                <label for="star4" title="4 stars">&#9733;</label>

                <input type="radio" id="star3" name="Rating" value="3 Stars" />
                <label for="star3" title="3 stars">&#9733;</label>

                <input type="radio" id="star2" name="Rating" value="2 Stars" />
                <label for="star2" title="2 stars">&#9733;</label>

                <input type="radio" id="star1" name="Rating" value="1 Star" />
                <label for="star1" title="1 star">&#9733;</label>
            </div>
        </div>

        <div class="form-group">
            <label for="category">Feedback Topic</label>
            <select id="category" name="Category" class="form-control" required>
                <option value="" disabled selected>Select a category...</option>
                <option value="General Feedback">General Feedback</option>
                <option value="Bug / Technical Issue">Bug / Technical Issue</option>
                <option value="Feature Request">Feature Request</option>
                <option value="User Experience">User Experience</option>
            </select>
        </div>

        <div class="form-group">
            <label for="sender_name">Your Name</label>
            <input type="text" id="sender_name" name="Name" class="form-control" placeholder="John Doe" required />
        </div>

        <div class="form-group">
            <label for="sender_email">Email Address</label>
            <input type="email" id="sender_email" name="email" class="form-control" placeholder="john@example.com" required />
        </div>

        <div class="form-group">
            <label for="message">Detailed Feedback</label>
            <textarea id="message" name="Message" class="form-control" placeholder="Please describe your thoughts or issue in detail..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Submit Feedback</button>
    </form>
</div>

<script>
    const form = document.getElementById('feedbackForm');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerText = 'Sending...';
        alertBox.style.display = 'none';

        const formData = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                alertBox.className = 'alert alert-success';
                alertBox.innerText = 'Thank you! Your feedback has been sent successfully.';
                alertBox.style.display = 'block';
                form.reset();
            } else {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'There was a problem submitting your feedback. Please try again.';
                alertBox.style.display = 'block';
            }
        } catch (error) {
            alertBox.className = 'alert alert-error';
            alertBox.innerText = 'Network error. Please check your connection and try again.';
            alertBox.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Feedback';
        }
    });
</script>

</body>
</html>
